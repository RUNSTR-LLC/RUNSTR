# zapstore.yaml for RUNSTR

name: RUNSTR
summary: Fitness competitions with rewards
description: |
  Track workouts, join competitions, and earn rewards.
  Works with any device connected to Apple Health or Health Connect.

repository: https://github.com/RUNSTR-LLC/RUNSTR
website: https://www.runstr.club/
license: MIT

tags:
  - fitness
  - health
  - sports
  - running
  - cycling
  - competition

# App icon (local path)
icon: assets/images/icon.png

# Screenshots (uncomment when available)
# images:
#   - assets/screenshots/teams.png
#   - assets/screenshots/profile.png
#   - assets/screenshots/captain-dashboard.png

# Release notes from changelog
release_notes: CHANGELOG.md

# APK source - local build output from prerelease workflow
release_source: ./android/app/build/outputs/apk/release/app-release.apk

# Enrich metadata from GitHub
metadata_sources:
  - github
